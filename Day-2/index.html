<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form with Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: #2d713d;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login Form</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="addUser()">Login</button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    
    let users = [];

    const addUser = () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (!username || !password) {
            alert("Please fill all fields");
            return;
        }

        const newUser = { username, password };

        users = [...users, newUser];

        renderTable(users);
    };

    const renderTable = (data) => {
        const tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = data
            .map(({ username, password }, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${username}</td>
                    <td>${password}</td>
                </tr>
            `)
            .join("");
    };

</script>

</body>
</html>
